<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Compounding Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one column, score summary first, today's check-in, then trends and suggestions. */
:root{
  --bg:#f4f6f3; --card:#ffffff; --ink:#18221d; --muted:#5d6b63;
  --accent:#1f7a52; --accent-soft:#dcefe5; --warn:#b45309; --line:#dfe5e0;
  --display:'Fraunces',Georgia,serif; --body:'DM Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101612; --card:#18211b; --ink:#e8efea; --muted:#9bab9f; --accent:#4cc38a; --accent-soft:#1f3a2c; --warn:#f0a35a; --line:#27342b; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101612; --card:#18211b; --ink:#e8efea; --muted:#9bab9f; --accent:#4cc38a; --accent-soft:#1f3a2c; --warn:#f0a35a; --line:#27342b; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;padding:20px 16px 48px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:1.7rem;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:1.1rem;margin:0 0 10px}
.sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.8rem}
.habit{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.habit:first-of-type{border-top:0}
.habit input{width:26px;height:26px;accent-color:var(--accent);flex:none}
.habit label{flex:1}
.habit strong{display:block}
.habit small{color:var(--muted)}
.pct{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;padding:10px;resize:vertical}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cell{aspect-ratio:1;border-radius:5px;background:var(--line)}
.l1{background:color-mix(in srgb,var(--accent) 30%,var(--line))}
.l2{background:color-mix(in srgb,var(--accent) 55%,var(--line))}
.l3{background:color-mix(in srgb,var(--accent) 80%,var(--line))}
.l4{background:var(--accent)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.row{margin-bottom:12px}
.row div:first-child{display:flex;justify-content:space-between;font-size:.92rem}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.warn{color:var(--warn)}
.note{color:var(--muted);font-size:.8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:380px){.tiles{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Daily Compounding Tracker</h1>
    <p class="sub" id="today-label"></p>
  </header>

  <section class="tiles" aria-label="Summary">
    <div class="tile"><b id="t-streak">0</b><span>day streak</span></div>
    <div class="tile"><b id="t-week">0%</b><span>this week</span></div>
    <div class="tile"><b id="t-index">1.00</b><span>compound index</span></div>
  </section>

  <section class="card">
    <h2>Today</h2>
    <div id="habits"></div>
  </section>

  <section class="card">
    <h2>Reflection</h2>
    <label for="note" class="sub">One win and one fix for tomorrow</label>
    <textarea id="note" placeholder="Win: ...  Fix: ..."></textarea>
  </section>

  <section class="card">
    <h2>Last 30 days</h2>
    <div class="heat" id="heat" role="img" aria-label="Heatmap of the last 30 days, darker means more habits done"></div>
    <p class="note">Darker means more of the 4 habits done. Outlined square is today.</p>
  </section>

  <section class="card">
    <h2>Consistency by habit (last 14 days)</h2>
    <div id="bars"></div>
  </section>

  <section class="card">
    <h2>Suggestions</h2>
    <ul id="tips"></ul>
  </section>

  <p class="note" id="status"></p>
</main>

<script>
const HABITS=[
  {id:'walk',name:'Walk or exercise',tiny:'Minimum: 10 minute walk',stack:'after your first tea or coffee'},
  {id:'learn',name:'Learn AI and Dynatrace',tiny:'Minimum: one lesson or 10 minutes hands-on',stack:'right after you log in to work, before the first ticket'},
  {id:'read',name:'Read a book',tiny:'Minimum: 5 pages',stack:'in bed, with the phone left in another spot'},
  {id:'reflect',name:'Daily reflection',tiny:'Minimum: two lines',stack:'while you close your laptop for the day'}
];
const STREAK_MIN=3; // a day counts toward the streak when at least 3 of 4 habits are done
let days={}; let store=null; let saveTimer=null;

function key(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function back(n){const d=new Date();d.setDate(d.getDate()-n);return key(d)}
function done(k){const e=days[k];return e?HABITS.filter(h=>e[h.id]).length:0}
const todayKey=back(0);

function ensureToday(){if(!days[todayKey])days[todayKey]={}}

function streak(){
  let n=0,i=done(todayKey)>=STREAK_MIN?0:1; // today in progress does not break the streak
  for(;;i++){if(done(back(i))>=STREAK_MIN)n++;else break;}
  return n;
}
function weekScore(){let s=0;for(let i=0;i<7;i++)s+=done(back(i));return Math.round(s/28*100)}
function habitRate(id,span){let c=0;for(let i=0;i<span;i++){if((days[back(i)]||{})[id])c++}return Math.round(c/span*100)}
function index(){ // 1% better for each day with at least 3 habits, over the last 365 days
  let c=0;for(let i=0;i<365;i++)if(done(back(i))>=STREAK_MIN)c++;return Math.pow(1.01,c);
}

function render(){
  document.getElementById('today-label').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('t-streak').textContent=streak();
  document.getElementById('t-week').textContent=weekScore()+'%';
  document.getElementById('t-index').textContent=index().toFixed(2);

  const hb=document.getElementById('habits');hb.innerHTML='';
  const e=days[todayKey]||{};
  HABITS.forEach(h=>{
    const r=document.createElement('div');r.className='habit';
    r.innerHTML='<input type="checkbox" id="c-'+h.id+'"><label for="c-'+h.id+'"><strong>'+h.name+'</strong><small>'+h.tiny+'</small></label><span class="pct">'+habitRate(h.id,14)+'%</span>';
    const cb=r.querySelector('input');cb.checked=!!e[h.id];
    cb.addEventListener('change',()=>{ensureToday();days[todayKey][h.id]=cb.checked;persist();render();});
    hb.appendChild(r);
  });
  const note=document.getElementById('note');
  if(document.activeElement!==note)note.value=e.note||'';

  const heat=document.getElementById('heat');heat.innerHTML='';
  for(let i=29;i>=0;i--){
    const k=back(i),n=done(k),c=document.createElement('div');
    c.className='cell'+(n?' l'+n:'')+(i===0?' today':'');c.title=k+': '+n+'/4';heat.appendChild(c);
  }
  const bars=document.getElementById('bars');bars.innerHTML='';
  HABITS.forEach(h=>{
    const p=habitRate(h.id,14),r=document.createElement('div');r.className='row';
    r.innerHTML='<div><span>'+h.name+'</span><span class="pct">'+p+'%</span></div><div class="bar"><i style="width:'+p+'%"></i></div>';
    bars.appendChild(r);
  });
  tips();
}

function tips(){
  const out=[];
  const logged=Object.keys(days).filter(k=>done(k)>0).length;
  if(logged<3){
    out.push('Start with the minimum version of each habit for the first week. Showing up matters more than doing a lot.');
  }
  const y=back(1);
  if(done(y)<STREAK_MIN&&logged>=3&&done(todayKey)<STREAK_MIN)
    out.push('<span class="warn">Yesterday was light.</span> Never miss twice. Do the minimum version of two habits today to keep the chain alive.');
  const rated=HABITS.map(h=>({h,p:habitRate(h.id,14)})).sort((a,b)=>a.p-b.p);
  if(logged>=3){
    const w=rated[0];
    if(w.p<60)out.push('Weakest habit: <b>'+w.h.name+'</b> at '+w.p+'%. Shrink it to the minimum and tie it to a fixed cue, '+w.h.stack+'.');
    const s=rated[rated.length-1];
    if(s.p>=80)out.push('<b>'+s.h.name+'</b> is solid at '+s.p+'%. Use it as the anchor and attach a weaker habit right after it.');
  }
  const wk=weekScore();
  if(logged>=7){
    if(wk>=85)out.push('Strong week at '+wk+'%. Raise one habit slightly, for example 10 more minutes of Dynatrace practice, and keep the rest unchanged.');
    else if(wk<50)out.push('This week is at '+wk+'%. Do not add anything. Reduce each habit to its minimum until you hit 3 of 4 for five days in a row.');
  }
  if(streak()>=7)out.push('Streak of '+streak()+' days. Plan a small non-food reward at 14 days.');
  const dow=new Date().getDay();
  if(dow===0)out.push('Sunday: review the week. Pick one thing to fix and write it in tonight\'s reflection.');
  out.push('Do one practical Dynatrace task each week, such as a dashboard, a problem investigation or a DQL query, so the learning builds on your production support work.');
  document.getElementById('tips').innerHTML=out.map(t=>'<li>'+t+'</li>').join('');
}

function persist(){
  const st=document.getElementById('status');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      if(store){await store.set({days});st.textContent='Saved';}
      else{localStorage.setItem('compound-days',JSON.stringify(days));st.textContent='Saved on this device only';}
    }catch(err){st.textContent='Could not save. Your changes stay on screen until you leave.';}
  },400);
}

document.getElementById('note').addEventListener('input',e=>{ensureToday();days[todayKey].note=e.target.value;persist();});

async function init(){
  try{const raw=localStorage.getItem('compound-days');if(raw)days=JSON.parse(raw)||{};}catch(e){}
  render();
  try{
    const user=await claude.use('user');const db=await claude.use('db');
    if(user&&db){
      const id=await user.id();
      const ref=db.collection('data/users/'+id).doc('tracker');
      const snap=await ref.get();
      const data=snap&&(snap.data?snap.data():snap);
      if(data&&data.days)days=Object.assign({},days,data.days);
      store=ref;render();
      document.getElementById('status').textContent='Saved to your account';
    }else{document.getElementById('status').textContent='Saved on this device only';}
  }catch(e){document.getElementById('status').textContent='Saved on this device only';}
}
init();
</script>
</body>
</html>
