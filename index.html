<style>
  :root { --bg: #f5f3ee; --card: #fffdf9; --text: #1f1d1a; --muted: #6d6a62; --border: #e2ded4; --accent: #d4521f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151515; --card: #1c1c1b; --text: #ecebe7; --muted: #a19e96; --border: #2c2b29; --accent: #ff7a45; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 24px; margin: 0 0 24px; }
  a.app { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; color: inherit; text-decoration: none; }
  a.app:hover { border-color: var(--accent); }
  a.app b { display: block; }
  a.app span { color: var(--muted); font-size: 14px; }
</style>
